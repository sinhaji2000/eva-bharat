server:
  port: 8080

spring:
  application:
    name: ava-bharat
  datasource:
    url: jdbc:mysql://localhost:3306/ava_bharat?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
