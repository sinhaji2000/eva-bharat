server:
  port: ${PORT:8080}

spring:
  application:
    name: ava-bharat
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ava_bharat?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    # Comma-separated list of frontend origins allowed to call /api/**
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://music-system-eva.vercel.app,http://localhost:5173,http://localhost:3000}
