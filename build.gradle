plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
   
    

    // ================= ACTUATOR =================
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Registry only - version comes from the Spring Boot BOM, so it stays in
    // step with the 3.5.x actuator above. runtimeOnly because nothing in this
    // codebase imports Prometheus classes; it is discovered at startup.
    

	implementation 'org.projectlombok:lombok:1.18.48'
	annotationProcessor 'org.projectlombok:lombok:1.18.48'
    // ================= DATABASE =================
    runtimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Heroku's Gradle buildpack runs `./gradlew stage`; build only the executable jar.
tasks.register('stage') {
	dependsOn 'bootJar'
}

tasks.named('jar') {
	enabled = false
}
